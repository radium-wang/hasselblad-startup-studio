name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_source.py
      - run: python3 CodeTests/check_source_tools.py
      - run: python3 -m compileall -q native tools CodeTests gen2
      - run: python3 CodeTests/check_gen2.py --report outputs/gen2-offline.json
